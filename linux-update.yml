
---
- name: Linux Server Maintenance
  hosts: all_servers
  become: true
  gather_facts: true
  serial: 1

  tasks:

    # 1. Check server connectivity
    - name: Check server connectivity
      ping:

    # 2. Update package cache
    - name: Update APT cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    # 3. Upgrade installed packages
    - name: Upgrade all packages
      apt:
        upgrade: safe
      register: upgrade_result

    # 4. Remove unused packages
    - name: Remove unused packages
      apt:
        autoremove: yes

    # 5. Clean package cache
    - name: Clean APT cache
      apt:
        autoclean: yes

    # 6. Check if reboot is required
    - name: Check reboot requirement
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    # 7. Reboot only when required
    - name: Reboot server
      reboot:
        msg: "Reboot initiated by Ansible after system upgrade"
        connect_timeout: 10
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: reboot_required.stat.exists

    # 8. Verify server is available
    - name: Verify server connectivity
      wait_for_connection:
        timeout: 300

    # 9. Verify server status
    - name: Check server uptime
      command: uptime
      register: server_uptime
      changed_when: false

    - name: Display server status
      debug:
        msg: "{{ server_uptime.stdout }}"
